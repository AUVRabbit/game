<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纸娃娃角色生成器</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#0f0f1a; --panel:#1a1a2e; --panel2:#242442;
  --text:#e0e0e0; --text2:#9ca3af; --border:#374151;
  --accent:#6366f1; --accent2:#818cf8; --danger:#ef4444; --gold:#d4a017;
}
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',Roboto,sans-serif; background:linear-gradient(135deg,#0f0f1a,#1a1a2e); color:var(--text); height:100vh; overflow:hidden; }

.app { display:flex; flex-direction:column; height:100vh; }

/* 顶栏 */
.topbar {
  background:var(--panel); padding:10px 18px; display:flex; align-items:center; gap:14px;
  border-bottom:1px solid var(--border);
}
.topbar h1 { font-size:1.15rem; font-weight:700; background:linear-gradient(90deg,#6366f1,#ec4899); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.topbar .spacer { flex:1; }
.btn {
  padding:6px 14px; border:none; border-radius:6px; cursor:pointer; font-size:0.85rem; font-weight:500;
  transition:all .15s; display:inline-flex; align-items:center; gap:5px;
}
.btn-pri { background:var(--accent); color:#fff; }
.btn-pri:hover { background:var(--accent2); transform:translateY(-1px); }
.btn-sec { background:var(--panel2); color:var(--text); border:1px solid var(--border); }
.btn-sec:hover { background:#2f2f54; border-color:var(--accent); }
.btn-sm { padding:4px 10px; font-size:0.75rem; }

/* 主体 */
.main { display:flex; flex:1; overflow:hidden; }

/* 左栏 - 预设 */
.presets {
  width:220px; background:var(--panel); border-right:1px solid var(--border); padding:14px; overflow-y:auto; flex-shrink:0;
}
.presets h3 { font-size:0.75rem; color:var(--text2); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
.preset-card {
  background:var(--panel2); border:2px solid var(--border); border-radius:10px; padding:12px;
  margin-bottom:10px; cursor:pointer; transition:all .15s; text-align:center;
}
.preset-card:hover { border-color:var(--accent); transform:translateY(-2px); }
.preset-card.active { border-color:var(--accent); background:rgba(99,102,241,0.15); }
.preset-emoji { font-size:2rem; line-height:1; margin-bottom:6px; }
.preset-name { font-size:0.85rem; font-weight:600; color:var(--text); }
.preset-desc { font-size:0.7rem; color:var(--text2); margin-top:3px; line-height:1.3; }

/* 中栏 - 画布 */
.stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; position:relative; }
.stage-bg {
  position:absolute; inset:0; z-index:0; pointer-events:none;
  background-image:linear-gradient(45deg,#1e1e36 25%,transparent 25%),linear-gradient(-45deg,#1e1e36 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1e1e36 75%),linear-gradient(-45deg,transparent 75%,#1e1e36 75%);
  background-size:24px 24px; background-position:0 0,0 12px,12px -12px,-12px 0; background-color:#16162a;
}
.stage-frame {
  width:340px; height:480px; position:relative; z-index:1;
  border-radius:14px; overflow:hidden;
  background:rgba(22,22,42,0.6); backdrop-filter:blur(10px);
  box-shadow:0 20px 60px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
}
#char-svg { width:100%; height:100%; display:block; }
#char-svg .part-group { transform-box:fill-box; transform-origin:center bottom; }

/* 姿态选择器 */
.pose-bar {
  position:absolute; top:20px; right:20px; display:flex; gap:8px; z-index:2;
}
.pose-chip {
  padding:8px 14px; background:var(--panel); border:1px solid var(--border); border-radius:20px;
  cursor:pointer; font-size:0.8rem; color:var(--text2); transition:all .15s;
}
.pose-chip:hover { border-color:var(--accent); color:var(--text); }
.pose-chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }

/* 右栏 - 部件 */
.parts-panel {
  width:300px; background:var(--panel); border-left:1px solid var(--border); padding:14px; overflow-y:auto; flex-shrink:0;
}
.section { margin-bottom:18px; }
.section-title {
  font-size:0.75rem; color:var(--text2); text-transform:uppercase; letter-spacing:1px;
  margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;
}
.section-title .curr { color:var(--accent); font-weight:600; text-transform:none; }

/* 部件选项网格 */
.options-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.opt {
  aspect-ratio:1; background:var(--panel2); border:2px solid var(--border); border-radius:8px;
  cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; transition:all .12s; padding:4px;
}
.opt:hover { border-color:var(--accent); transform:translateY(-2px); }
.opt.active { border-color:var(--accent); background:rgba(99,102,241,0.2); }
.opt svg { width:44px; height:44px; }
.opt-label { font-size:0.65rem; color:var(--text2); }

/* 姿态选择 */
.pose-select {
  display:flex; gap:6px; flex-wrap:wrap;
}
.pose-btn {
  padding:6px 10px; background:var(--panel2); border:1px solid var(--border); border-radius:6px;
  cursor:pointer; font-size:0.8rem; color:var(--text2); transition:all .12s;
}
.pose-btn:hover { border-color:var(--accent); color:var(--text); }
.pose-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

/* 颜色设置 */
.colors-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.color-row { display:flex; align-items:center; gap:6px; background:var(--panel2); padding:6px 8px; border-radius:6px; }
.color-row label { font-size:0.75rem; color:var(--text2); flex:1; }
.color-row input[type="color"] {
  width:28px; height:22px; border:1px solid var(--border); border-radius:4px; cursor:pointer; background:transparent; padding:0;
}

/* 开关 */
.switch-row { display:flex; align-items:center; justify-content:space-between; background:var(--panel2); padding:8px 12px; border-radius:6px; margin-bottom:8px; }
.switch-row label { font-size:0.8rem; color:var(--text); }
.switch { position:relative; width:38px; height:20px; }
.switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; cursor:pointer; inset:0; background:var(--border); border-radius:20px; transition:.2s; }
.slider:before {
  content:""; position:absolute; height:14px; width:14px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s;
}
.switch input:checked + .slider { background:var(--accent); }
.switch input:checked + .slider:before { transform:translateX(18px); }

/* 范围滑块 */
.range-row { display:flex; align-items:center; gap:10px; background:var(--panel2); padding:8px 12px; border-radius:6px; }
.range-row label { font-size:0.8rem; color:var(--text2); min-width:60px; }
.range-row input[type="range"] { flex:1; accent-color:var(--accent); }

/* 滚动条 */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--accent); }

/* 响应式 */
@media (max-width:1100px) {
  .presets { width:180px; }
  .parts-panel { width:260px; }
}
@media (max-width:800px) {
  .main { flex-direction:column; }
  .presets, .parts-panel { width:100%; max-height:180px; border:none; border-bottom:1px solid var(--border); }
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>🎭 纸娃娃角色生成器</h1>
    <div class="spacer"></div>
    <button class="btn btn-sec" id="btn-random">🎲 随机</button>
    <button class="btn btn-pri" id="btn-export-png">⬇️ PNG</button>
    <button class="btn btn-pri" id="btn-export-svg">⬇️ SVG</button>
  </div>

  <div class="main">
    <!-- 左侧预设 -->
    <div class="presets" id="presets-list"></div>

    <!-- 中央画布 -->
    <div class="stage">
      <div class="stage-bg"></div>
      <div class="stage-frame">
        <svg id="char-svg" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="pose-bar" id="pose-bar"></div>
    </div>

    <!-- 右侧部件 -->
    <div class="parts-panel">
      <div class="section">
        <div class="section-title">角色部件</div>
        <div id="current-parts"></div>
      </div>

      <div class="section">
        <div class="section-title">姿态动作</div>
        <div class="pose-select" id="pose-select"></div>
        <div class="switch-row" style="margin-top:10px;">
          <label>🔄 动画循环</label>
          <label class="switch"><input type="checkbox" id="anim-toggle" checked><span class="slider"></span></label>
        </div>
        <div class="range-row">
          <label>速度</label>
          <input type="range" id="anim-speed" min="0.3" max="2.5" step="0.1" value="1">
        </div>
      </div>

      <div class="section">
        <div class="section-title">整体控制</div>
        <div class="switch-row">
          <label>↔️ 水平翻转</label>
          <label class="switch"><input type="checkbox" id="flip-h"><span class="slider"></span></label>
        </div>
        <div class="range-row">
          <label>缩放</label>
          <input type="range" id="scale" min="0.6" max="1.8" step="0.05" value="1">
        </div>
      </div>

      <div class="section">
        <div class="section-title">🎨 颜色微调</div>
        <button class="btn btn-sec btn-sm" id="btn-random-colors" style="margin-bottom:10px;">随机配色</button>
        <div class="colors-grid" id="colors-panel"></div>
      </div>
    </div>
  </div>
</div>

<script src="parts-library.js"></script>
<script src="app.js"></script>
</body>
</html>
